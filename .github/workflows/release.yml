name: Publish verified Windows release

on:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-main-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Admit only the current verified main commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $current = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify main.' }
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:SOURCE_SHA&event=push&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify CI and Security.' }
          $verified = $current -eq $env:SOURCE_SHA
          foreach ($file in @('ci.yml', 'security.yml')) {
            $workflow = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$file" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot identify required workflow.' }
            $run = @($runs.workflow_runs | Where-Object { $_.workflow_id -eq $workflow.id -and $_.head_branch -eq 'main' } | Sort-Object created_at -Descending)[0]
            if (-not $run -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { $verified = $false }
          }
          "current=$verified".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Choose an idempotent stable release version
        if: steps.head.outputs.current == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # gh refuses --slurp together with --jq. One JSON release per line means
          # the pages need no flattening, whichever PowerShell parses them.
          $lines = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read releases.' }
          ConvertTo-Json -InputObject @($lines | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json }) -Depth 20 | Set-Content -LiteralPath "$env:RUNNER_TEMP/releases.json" -Encoding utf8
          node scripts/release-version.mjs "$env:RUNNER_TEMP/releases.json" $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot choose a release version.' }
      - name: Install locked build dependencies
        if: steps.head.outputs.current == 'true' && steps.version.outputs.skip == 'false'
        run: npm ci --ignore-scripts
      - name: Set the artifact version
        if: steps.head.outputs.current == 'true' && steps.version.outputs.skip == 'false'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const version=process.env.RELEASE_VERSION; if(!/^\d+\.\d+\.\d+$/.test(version))throw new Error('Invalid version'); for(const file of ['package.json','package-lock.json']){const data=JSON.parse(fs.readFileSync(file,'utf8'));data.version=version;if(data.packages?.[''])data.packages[''].version=version;fs.writeFileSync(file,JSON.stringify(data,null,2));}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot set the artifact version.' }
      - name: Build the offline Windows installer
        if: steps.head.outputs.current == 'true' && steps.version.outputs.skip == 'false'
        run: npm run package:installer
      - name: Publish complete assets from a draft
        if: steps.head.outputs.current == 'true' && steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $current = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot recheck main.' }
          if ($current -ne $env:SOURCE_SHA) { Write-Output 'A newer main superseded this build.'; exit 0 }
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:SOURCE_SHA&event=push&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot recheck CI and Security.' }
          foreach ($file in @('ci.yml', 'security.yml')) {
            $workflow = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$file" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot identify required workflow.' }
            $run = @($runs.workflow_runs | Where-Object { $_.workflow_id -eq $workflow.id -and $_.head_branch -eq 'main' } | Sort-Object created_at -Descending)[0]
            if (-not $run -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { Write-Output 'CI or Security is not currently successful.'; exit 0 }
          }
          $metadata = Get-ChildItem desktop-builds -Filter release.json -Recurse | Select-Object -First 1
          if (-not $metadata) { throw 'Release metadata is missing.' }
          $release = Get-Content -LiteralPath $metadata.FullName -Raw | ConvertFrom-Json
          if ($release.sourceRevision -ne $env:SOURCE_SHA -or ('v' + $release.version) -ne $env:RELEASE_TAG) { throw 'Artifact source or version mismatch.' }
          $folder = $metadata.Directory.FullName
          $assets = @((Join-Path $folder 'Waleed-MCP-Hub-Setup.exe'), (Join-Path $folder 'SHA256SUMS.txt'), $metadata.FullName)
          foreach ($asset in $assets) { if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw 'Release asset is missing.' } }
          $expected = ((Get-Content -LiteralPath $assets[1] -Raw).Split(' '))[0]
          if ((Get-FileHash -LiteralPath $assets[0] -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Installer checksum mismatch.' }
          $marker = "<!-- wmh-release:$env:SOURCE_SHA -->"
          $lines = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list release drafts.' }
          $found = @($lines | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
          if ($found.Count -gt 1) { throw 'Ambiguous release tag.' }
          if ($found.Count -eq 0) {
            @{ tag_name = $env:RELEASE_TAG; target_commitish = $env:SOURCE_SHA; name = "Waleed MCP Hub $env:RELEASE_TAG"; draft = $true; body = $marker; generate_release_notes = $true } | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/draft.json" -Encoding utf8
            $draft = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases" --input "$env:RUNNER_TEMP/draft.json" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create release draft.' }
          } else { $draft = $found[0] }
          $expectedNames = @($assets | ForEach-Object { Split-Path -Leaf $_ })
          if (-not $draft.draft -or $draft.target_commitish -ne $env:SOURCE_SHA -or -not $draft.body.Contains($marker)) { throw 'Release is not an owned draft for this commit.' }
          foreach ($asset in $draft.assets) {
            if ($asset.name -notin $expectedNames) { throw 'Owned draft has unexpected assets.' }
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot replace draft asset.' }
          }
          foreach ($asset in $assets) {
            $name = [Uri]::EscapeDataString((Split-Path -Leaf $asset))
            gh api --method POST "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($draft.id)/assets?name=$name" -H 'Content-Type: application/octet-stream' --input $asset --silent
            if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          }
          # Upload can take minutes. Recheck the authoritative gates immediately before publication.
          $current = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot recheck main after upload.' }
          if ($current -ne $env:SOURCE_SHA) { Write-Output 'A newer main superseded this draft.'; exit 0 }
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:SOURCE_SHA&event=push&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot recheck workflow runs after upload.' }
          foreach ($file in @('ci.yml', 'security.yml')) {
            $workflow = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$file" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot identify required workflow.' }
            $run = @($runs.workflow_runs | Where-Object { $_.workflow_id -eq $workflow.id -and $_.head_branch -eq 'main' } | Sort-Object created_at -Descending)[0]
            if (-not $run -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { Write-Output 'Required workflow is no longer successful; leaving draft.'; exit 0 }
          }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($draft.id)" -F draft=false -f make_latest=true --silent
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
