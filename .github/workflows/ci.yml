name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run check:secrets
      # The process and DPAPI hosts compile C# with Add-Type at startup. A cold
      # runner's first compile exceeds the hosts' startup budget, so warm it.
      - name: Warm the .NET compiler
        shell: powershell
        run: |
          foreach ($i in 1..3) {
            Add-Type -TypeDefinition "public static class Warm$i { public static int Value() { return $i; } }"
          }
      - run: npm test
      - run: npm run build
      - run: npm run test:windows-runtime
      - run: npm run test:windows-secrets
